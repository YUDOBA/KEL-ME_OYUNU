<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-title" content="Kelime Oyunu" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Kelime Oyunu</title>
  <style>
    :root{--bg:#f0fdf4;--card:#fff;--ink:#134e4a;--muted:#5b7c78;--teal:#0d9488;--teal-dark:#0f766e;--good:#16a34a;--bad:#dc2626;--soft:#ccfbf1;--shadow:0 10px 30px rgba(15,118,110,.12);--radius:18px}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{caret-color:transparent}
    body,button,.opt,.word-card,.cat,.feedback,.en-word{
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    }
    input,textarea,.search{caret-color:auto;-webkit-user-select:text;user-select:text}
    body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(900px 400px at 10% -10%,#99f6e4 0%,transparent 50%),radial-gradient(700px 360px at 110% 0%,#a5f3fc 0%,transparent 46%),var(--bg);color:var(--ink);padding:16px 16px 32px}
    .wrap{max-width:560px;margin:0 auto}
    header.app{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px;gap:8px}
    .head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    h1{font-size:1.3rem;letter-spacing:-.02em}
    .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
    button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .icon-btn{width:42px;height:42px;border-radius:12px;background:var(--card);color:var(--teal-dark);box-shadow:var(--shadow);font-size:1.1rem}
    .icon-btn.home{background:#0d9488;color:#fff}
    .screen{display:none;animation:in .25s ease}.screen.active{display:block}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .grid{display:grid;gap:12px}.cats{grid-template-columns:1fr 1fr}
    .cat{background:var(--card);border-radius:var(--radius);padding:16px 12px;text-align:center;box-shadow:var(--shadow);min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
    .cat:active{transform:scale(.97)}
    .cat .emoji{font-size:1.8rem}.cat .name{font-weight:700;font-size:.92rem;line-height:1.25}.cat .meta{font-size:.72rem;color:var(--muted)}
    .progress-wrap{margin-bottom:14px}
    .progress-row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px;gap:8px}
    .bar{height:8px;background:#d1fae5;border-radius:99px;overflow:hidden}
    .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,#0f766e);transition:width .25s}
    .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--teal-dark)}
    .word-card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:26px 16px;text-align:center;margin-bottom:16px}
    .badge{display:inline-block;background:var(--soft);color:var(--teal-dark);font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;margin-bottom:10px}
    .word-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    .en-word{font-size:clamp(1.35rem,5.6vw,2.15rem);font-weight:800;letter-spacing:-.03em}
    .speak-btn,.fav-btn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:#0d9488;color:#fff;font-size:1.15rem;box-shadow:0 6px 16px rgba(13,148,136,.28)}
    .fav-btn{background:#fff;color:#b45309;border:2px solid #fde68a}
    .fav-btn.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
    .speak-btn.mini,.fav-btn.mini{width:34px;height:34px;font-size:.9rem;box-shadow:none}
    .speak-btn.mini{background:#ccfbf1;color:#0f766e}
    .hint{margin-top:8px;color:var(--muted);font-size:.9rem}
    .opts{display:grid;gap:10px}
    .opt{background:var(--card);border-radius:16px;padding:16px 14px;text-align:left;font-size:1.02rem;font-weight:650;box-shadow:var(--shadow);border:2px solid transparent;outline:none}
    .opt.correct{background:#dcfce7;border-color:#16a34a;color:#14532d}
    .opt.wrong{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}
    .opt.dim{opacity:.55}
    .feedback{margin-top:14px;min-height:28px;text-align:center;font-weight:700}
    .feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
    .result-hero{text-align:center;padding:10px 0 6px}.big-score{font-size:2.3rem;font-weight:800}
    .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .result-grid.four{grid-template-columns:1fr 1fr 1fr 1fr}
    @media(max-width:420px){.result-grid.four{grid-template-columns:1fr 1fr}}
    .stat{background:#f0fdfa;border-radius:14px;padding:12px 8px;text-align:center}
    .stat b{display:block;font-size:1.12rem}.stat span{font-size:.72rem;color:var(--muted)}
    .btn{width:100%;border-radius:14px;padding:14px;background:var(--teal);color:#fff;font-weight:700;margin-top:8px}
    .btn.ghost{background:#fff;color:var(--teal-dark);border:2px solid #99f6e4}
    .missed{margin-top:10px;font-size:.9rem;color:var(--muted)}.missed li{margin:4px 0 4px 18px}
    .cat-stat{margin:12px 0;padding-bottom:10px;border-bottom:1px solid #ccfbf1}
    footer.note{text-align:center;color:var(--muted);font-size:.78rem;margin-top:18px;line-height:1.45}
    .dict-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
    .search{width:100%;border:2px solid #99f6e4;border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);background:#fff}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .seg button{border-radius:12px;padding:10px;background:#fff;color:var(--teal-dark);border:2px solid #99f6e4;font-weight:700}
    .seg button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
    .dict-cat{margin-bottom:10px;border-radius:14px;overflow:hidden;border:1px solid #ccfbf1;background:#fff}
    .dict-cat h3{padding:12px 14px;background:#f0fdfa;cursor:pointer;font-size:.95rem;display:flex;justify-content:space-between;align-items:center}
    .dict-rows{display:none}.dict-cat.open .dict-rows{display:block}
    .drow{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid #f0fdfa;font-size:.92rem}
    .drow .from{font-weight:700}.drow .to{color:var(--muted);text-align:right}
    .dict-count{font-size:.78rem;color:var(--muted)}
    .empty{text-align:center;color:var(--muted);padding:18px 8px}
  </style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div>
      <h1>Kelime Oyunu</h1>
      <div class="sub" id="headerSub">Kategori seç, 20 kelime öğren</div>
    </div>
    <div class="head-actions">
      <button class="icon-btn home" id="goHome" title="Ana ekran" style="display:none">🏠</button>
      <button class="icon-btn" id="favNav" title="Favoriler">⭐</button>
      <button class="icon-btn" id="dictBtn" title="Sözlük">📖</button>
      <button class="icon-btn" id="statsBtn" title="İstatistikler">📊</button>
    </div>
  </header>
  <section id="home" class="screen active">
    <div class="grid cats" id="catGrid"></div>
    <footer class="note">Her ekranda 🏠 ana sayfaya döner. 🔊 telaffuz, ☆ favori. Sözlükte tümünü aç/kapa var.</footer>
  </section>
  <section id="quiz" class="screen">
    <div class="progress-wrap">
      <div class="progress-row"><span id="phaseLabel">Ana tur</span><span class="timer" id="timer">0:00</span><span id="progressText">1 / 20</span></div>
      <div class="bar"><span id="progressBar"></span></div>
    </div>
    <div class="word-card">
      <div class="badge" id="catBadge">Kategori</div>
      <div class="word-row">
        <div class="en-word" id="enWord">apple</div>
        <button class="speak-btn" id="speakBtn" title="Telaffuz">🔊</button>
        <button class="fav-btn" id="favBtn" title="Favori">☆</button>
      </div>
      <div class="hint">Türkçe karşılığını seç</div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
  </section>
  <section id="result" class="screen">
    <div class="card">
      <div class="result-hero">
        <div class="badge" id="resultBadge">Tur bitti</div>
        <div class="big-score" id="resultScore">0 / 20</div>
        <div class="sub" id="resultMsg">Tebrikler</div>
      </div>
      <div class="result-grid four">
        <div class="stat"><b id="sCorrect">0</b><span>Doğru</span></div>
        <div class="stat"><b id="sWrong">0</b><span>Yanlış</span></div>
        <div class="stat"><b id="sAcc">0%</b><span>İsabet</span></div>
        <div class="stat"><b id="sTime">0:00</b><span>20’lik süre</span></div>
      </div>
      <ul class="missed" id="missedList"></ul>
    </div>
    <button class="btn" id="againBtn">Aynı kategoride yeni tur</button>
    <button class="btn ghost" id="homeBtn">Ana ekran</button>
  </section>
  <section id="stats" class="screen">
    <div class="card" id="statsBody"></div>
    <button class="btn ghost" id="resetStats">İstatistikleri sıfırla</button>
    <button class="btn" id="statsHome">Ana ekran</button>
  </section>
  <section id="dict" class="screen">
    <div class="card">
      <div class="dict-tools">
        <input class="search" id="dictSearch" type="search" placeholder="Kelime ara..." />
        <div class="seg">
          <button id="dirEn" class="on">İngilizce → Türkçe</button>
          <button id="dirTr">Türkçe → İngilizce</button>
        </div>
        <button class="btn ghost" id="toggleAll" style="margin-top:0">Tümünü daralt</button>
      </div>
      <div class="dict-count" id="dictCount"></div>
    </div>
    <div id="dictList"></div>
    <button class="btn" id="dictHome">Ana ekran</button>
  </section>
  <section id="favs" class="screen">
    <div class="card">
      <div class="dict-tools">
        <input class="search" id="favSearch" type="search" placeholder="Favorilerde ara..." />
        <div class="seg">
          <button id="favDirEn" class="on">İngilizce → Türkçe</button>
          <button id="favDirTr">Türkçe → İngilizce</button>
        </div>
      </div>
      <div class="dict-count" id="favCount"></div>
    </div>
    <div id="favList"></div>
    <button class="btn ghost" id="clearFavs">Favorileri temizle</button>
    <button class="btn" id="favHome">Ana ekran</button>
  </section>
</div>

const SESSION_LEN=20, MAX_CORRECT_STREAK=3, MIN_SKIP_AFTER_STREAK=1;
const STORE_KEY="kelimeOyunuStats_v2";
const FAV_KEY="kelimeOyunuFavs_v1";
const state={catId:null,queue:[],index:0,phase:"main",sessionCorrect:0,sessionWrong:0,missed:[],locked:false,startedAt:0,mainElapsedMs:0,tick:null,dictDir:"en",favDir:"en",dictOpenAll:true};
function emptyStore(){return {cats:{},totalCorrect:0,totalWrong:0,totalMs:0}}
function loadStats(){try{return Object.assign(emptyStore(),JSON.parse(localStorage.getItem(STORE_KEY))||{})}catch(e){return emptyStore()}}
function saveStats(s){localStorage.setItem(STORE_KEY,JSON.stringify(s))}
function loadFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY))||[]}catch(e){return []}}
function saveFavs(a){localStorage.setItem(FAV_KEY,JSON.stringify(a))}
function favKey(en,tr){return (en+"|"+tr).toLowerCase()}
function isFav(en,tr){return loadFavs().some(function(f){return favKey(f.en,f.tr)===favKey(en,tr)})}
function toggleFav(en,tr,catId){
  var list=loadFavs();
  var i=list.findIndex(function(f){return favKey(f.en,f.tr)===favKey(en,tr)});
  if(i>=0) list.splice(i,1); else list.unshift({en:en,tr:tr,catId:catId,at:Date.now()});
  saveFavs(list); return i<0;
}
function ensureCat(s,id){
  if(!s.cats[id]) s.cats[id]={correct:0,wrong:0,plays:0,totalMs:0,lastMs:0,bestMs:null,lastCorrect:0,lastWrong:0,lastAt:null,missed:[],words:{}};
  if(!s.cats[id].words) s.cats[id].words={};
  if(!s.cats[id].missed) s.cats[id].missed=[];
  return s.cats[id];
}
function wordMeta(cs,en){if(!cs.words[en]) cs.words[en]={shown:0,streak:0,cooldown:0};return cs.words[en]}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pickN(arr,n){return shuffle(arr).slice(0,Math.min(n,arr.length))}
function fmtTime(ms){var s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function blurFocus(){
  var a=document.activeElement;
  if(a&&a!==document.body&&a.blur&&a.tagName!=="INPUT") a.blur();
}
function show(id){
  document.querySelectorAll(".screen").forEach(function(el){el.classList.remove("active")});
  document.getElementById(id).classList.add("active");
  document.getElementById("goHome").style.display = id==="home" ? "none" : "inline-flex";
  if(id!=="dict"&&id!=="favs") blurFocus();
}
var speechReady=false, speechVoice=null, speechQueueTimer=null;
function pickEnVoice(){
  var voices=speechSynthesis.getVoices()||[];
  speechVoice=voices.find(function(v){return /en-US/i.test(v.lang)&&/Google|Samantha|Siri|Daniel|David|Female|Male/i.test(v.name)})
    ||voices.find(function(v){return /^en(-|_)US/i.test(v.lang)})
    ||voices.find(function(v){return v.lang&&v.lang.toLowerCase().indexOf("en")===0})
    ||null;
}
function warmSpeech(){
  if(!window.speechSynthesis||speechReady) return;
  pickEnVoice();
  try{
    var warm=new SpeechSynthesisUtterance(" ");
    warm.volume=0; warm.rate=1; warm.lang="en-US";
    if(speechVoice) warm.voice=speechVoice;
    speechSynthesis.speak(warm);
  }catch(e){}
  speechReady=true;
}
function makeUtterance(text){
  var u=new SpeechSynthesisUtterance(String(text||"").replace(/^\s+/, ""));
  u.lang="en-US"; u.rate=0.88; u.pitch=1; u.volume=1;
  if(speechVoice) u.voice=speechVoice;
  return u;
}
function speakEnglish(text){
  if(!window.speechSynthesis||!text) return;
  pickEnVoice();
  if(speechQueueTimer){clearTimeout(speechQueueTimer);speechQueueTimer=null}
  var start=function(){
    var spoken=false;
    var say=function(){
      if(spoken) return; spoken=true;
      speechSynthesis.speak(makeUtterance(text));
    };
    try{
      var pad=new SpeechSynthesisUtterance(" ");
      pad.volume=0.01; pad.rate=1.15; pad.lang="en-US";
      if(speechVoice) pad.voice=speechVoice;
      pad.onend=say;
      pad.onerror=say;
      speechSynthesis.speak(pad);
      speechQueueTimer=setTimeout(say,220);
    }catch(e){
      say();
    }
  };
  if(speechSynthesis.speaking||speechSynthesis.pending){
    speechSynthesis.cancel();
    speechQueueTimer=setTimeout(start,120);
  } else {
    start();
  }
}
if(window.speechSynthesis){
  pickEnVoice();
  speechSynthesis.onvoiceschanged=pickEnVoice;
  document.addEventListener("pointerdown",warmSpeech,{once:true,passive:true});
}
function wordTokens(en){return String(en||"").trim().split(/\s+/).filter(Boolean).length}
function isCommonWord(catId,en){
  var n=wordTokens(en), len=String(en||"").trim().length;
  if(catId==="jobs") return n===1;
  if(catId==="phrases"){
    var s=String(en||"").toLowerCase();
    if(/how are you|thank you|please|hello|goodbye|excuse me|i'm sorry|good morning|good night|how much|where is|i don't understand|see you|nice to meet|what's your name|you're welcome|of course|i don't know/.test(s)) return true;
    return len<=16 && n<=3;
  }
  if(catId==="verbs") return n===1;
  if(catId==="adjectives") return n===1 && len<=12;
  if(catId==="care") return n<=2 && len<=18;
  if(catId==="appliances") return n<=2 && len<=18;
  return n===1;
}
function takeFrom(pool,need,used,shownFn){
  var sorted=pool.slice().sort(function(a,b){
    var d=shownFn(a[0])-shownFn(b[0]);
    return d!==0?d:Math.random()-0.5;
  });
  var out=[];
  for(var i=0;i<sorted.length && out.length<need;i++){
    if(used[sorted[i][0]]) continue;
    used[sorted[i][0]]=1;
    out.push({en:sorted[i][0],tr:sorted[i][1]});
  }
  return out;
}
function buildQueue(catId){
  var cat=CATEGORIES[catId], stats=loadStats(), cs=ensureCat(stats,catId);
  Object.keys(cs.words).forEach(function(k){if(cs.words[k].cooldown>0) cs.words[k].cooldown-=1});
  var used={}, queue=[], shown=function(en){return wordMeta(cs,en).shown||0};
  var needC=15, needR=5;
  shuffle(cs.missed||[]).forEach(function(pair){
    if(queue.length>=SESSION_LEN) return;
    if(!cat.words.some(function(w){return w[0]===pair[0]})||used[pair[0]]) return;
    used[pair[0]]=1;
    queue.push({en:pair[0],tr:pair[1]});
    if(isCommonWord(catId,pair[0])) needC--; else needR--;
  });
  if(needC<0){needR+=needC;needC=0}
  if(needR<0){needC+=needR;needR=0}
  var available=cat.words.filter(function(w){return !used[w[0]] && wordMeta(cs,w[0]).cooldown<=0});
  var common=available.filter(function(w){return isCommonWord(catId,w[0])});
  var rare=available.filter(function(w){return !isCommonWord(catId,w[0])});
  queue=queue.concat(takeFrom(common,Math.max(0,needC),used,shown));
  queue=queue.concat(takeFrom(rare,Math.max(0,needR),used,shown));
  if(queue.length<SESSION_LEN){
    var leftover=cat.words.filter(function(w){return !used[w[0]]});
    leftover.sort(function(a,b){return shown(a[0])-shown(b[0])});
    leftover.forEach(function(w){
      if(queue.length<SESSION_LEN){used[w[0]]=1;queue.push({en:w[0],tr:w[1]})}
    });
  }
  saveStats(stats); return shuffle(queue);
}
function renderHome(){
  var stats=loadStats(), grid=document.getElementById("catGrid"); grid.innerHTML="";
  Object.keys(CATEGORIES).forEach(function(id){
    var cat=CATEGORIES[id], cs=stats.cats[id], meta=cat.words.length+" kelime";
    if(cs&&cs.plays){
      var acc=(cs.correct+cs.wrong)?Math.round(cs.correct/(cs.correct+cs.wrong)*100)+"%":"—";
      var miss=(cs.missed&&cs.missed.length)?" · "+cs.missed.length+" yanlış":"";
      meta=cat.words.length+" · "+acc+" · "+fmtTime(cs.lastMs||0)+miss;
    }
    var btn=document.createElement("button"); btn.className="cat";
    btn.innerHTML='<div class="emoji">'+cat.emoji+'</div><div class="name">'+cat.name+'</div><div class="meta">'+meta+'</div>';
    btn.onclick=function(){startCategory(id)}; grid.appendChild(btn);
  });
  document.getElementById("headerSub").textContent="Kategori seç, 20 kelime öğren";
}
function stopTimer(){if(state.tick){clearInterval(state.tick);state.tick=null}}
function startTimer(){
  stopTimer(); state.startedAt=Date.now();
  document.getElementById("timer").textContent="0:00";
  state.tick=setInterval(function(){document.getElementById("timer").textContent=fmtTime(Date.now()-state.startedAt)},250);
}
function startCategory(id){
  var cat=CATEGORIES[id];
  state.catId=id; state.queue=buildQueue(id); state.index=0; state.phase="main";
  state.sessionCorrect=0; state.sessionWrong=0; state.missed=[]; state.locked=false; state.mainElapsedMs=0;
  document.getElementById("headerSub").textContent=cat.name;
  document.getElementById("catBadge").textContent=cat.emoji+" "+cat.name;
  show("quiz"); startTimer(); renderQuestion();
}
function currentQ(){return state.queue[state.index]}
function syncFavBtn(){
  var q=currentQ(); if(!q) return;
  var on=isFav(q.en,q.tr), b=document.getElementById("favBtn");
  b.classList.toggle("on",on); b.textContent=on?"★":"☆";
}
function renderQuestion(){
  var q=currentQ(), cat=CATEGORIES[state.catId];
  document.getElementById("enWord").textContent=q.en;
  document.getElementById("feedback").textContent="";
  document.getElementById("feedback").className="feedback";
  document.getElementById("phaseLabel").textContent=state.phase==="main"?"Ana tur":"Yanlışların tekrarı";
  document.getElementById("progressText").textContent=(state.index+1)+" / "+state.queue.length;
  document.getElementById("progressBar").style.width=(state.index/state.queue.length*100)+"%";
  syncFavBtn();
  var others=cat.words.filter(function(w){return w[1]!==q.tr});
  var options=shuffle([q.tr].concat(pickN(others,3).map(function(w){return w[1]})));
  var box=document.getElementById("opts"); box.innerHTML="";
  options.forEach(function(opt){
    var b=document.createElement("button"); b.className="opt"; b.textContent=opt;
    b.onclick=function(){choose(opt,q.tr,b)}; box.appendChild(b);
  });
  state.locked=false;
}
function choose(selected,correct,btn){
  if(state.locked) return; state.locked=true; blurFocus();
  document.querySelectorAll(".opt").forEach(function(b){
    b.disabled=true;
    if(b.textContent===correct) b.classList.add("correct"); else b.classList.add("dim");
  });
  var fb=document.getElementById("feedback"), q=currentQ(), ok=selected===correct;
  if(ok){btn.classList.remove("dim");btn.classList.add("correct");fb.textContent="Doğru ✓";fb.className="feedback good";if(state.phase==="main") state.sessionCorrect++}
  else{btn.classList.remove("dim");btn.classList.add("wrong");fb.textContent="Yanlış ✗  — doğrusu: "+correct;fb.className="feedback bad";state.missed.push(q);if(state.phase==="main") state.sessionWrong++}
  document.getElementById("progressBar").style.width=((state.index+1)/state.queue.length*100)+"%";
  setTimeout(nextStep, ok?700:1050);
}
function nextStep(){
  if(state.index<state.queue.length-1){state.index++;renderQuestion();return}
  if(state.phase==="main"){
    state.mainElapsedMs=Date.now()-state.startedAt; persistRoundMemory();
    if(state.missed.length){state.phase="review";state.queue=state.missed.slice();state.missed=[];state.index=0;renderQuestion();return}
  }
  finishSession();
}
function persistRoundMemory(){
  var stats=loadStats(), cs=ensureCat(stats,state.catId);
  var missedEns={}; state.missed.forEach(function(m){missedEns[m.en]=1});
  state.queue.forEach(function(q){
    var m=wordMeta(cs,q.en); m.shown=(m.shown||0)+1;
    if(missedEns[q.en]){m.streak=0;m.cooldown=0}
    else{m.streak=(m.streak||0)+1; if(m.streak>=MAX_CORRECT_STREAK){m.cooldown=MIN_SKIP_AFTER_STREAK;m.streak=0}}
  });
  cs.missed=state.missed.map(function(q){return [q.en,q.tr]}); saveStats(stats);
}
function finishSession(){
  stopTimer();
  var stats=loadStats(), cs=ensureCat(stats,state.catId);
  var ms=state.mainElapsedMs||(Date.now()-state.startedAt);
  cs.correct+=state.sessionCorrect; cs.wrong+=state.sessionWrong; cs.plays+=1;
  cs.lastCorrect=state.sessionCorrect; cs.lastWrong=state.sessionWrong;
  cs.lastAt=new Date().toISOString(); cs.lastMs=ms; cs.totalMs=(cs.totalMs||0)+ms;
  if(cs.bestMs==null||ms<cs.bestMs) cs.bestMs=ms;
  stats.totalCorrect+=state.sessionCorrect; stats.totalWrong+=state.sessionWrong; stats.totalMs=(stats.totalMs||0)+ms;
  saveStats(stats);
  var total=state.sessionCorrect+state.sessionWrong;
  var acc=total?Math.round(state.sessionCorrect/total*100):0;
  document.getElementById("resultBadge").textContent=CATEGORIES[state.catId].name;
  document.getElementById("resultScore").textContent=state.sessionCorrect+" / "+total;
  document.getElementById("sCorrect").textContent=state.sessionCorrect;
  document.getElementById("sWrong").textContent=state.sessionWrong;
  document.getElementById("sAcc").textContent=acc+"%";
  document.getElementById("sTime").textContent=fmtTime(ms);
  document.getElementById("resultMsg").textContent=acc>=85?"Harika! Kelimeler oturuyor.":acc>=60?"İyi gidiyor.":"Tekrar etmek iyi gelir.";
  var stored=(loadStats().cats[state.catId]&&loadStats().cats[state.catId].missed)||[];
  var list=document.getElementById("missedList");
  list.innerHTML=stored.length?"<strong>Sonraki tura taşınan yanlışlar ("+stored.length+"):</strong>"+stored.map(function(w){return "<li>"+w[0]+" → "+w[1]+"</li>"}).join(""):(state.sessionWrong?"<em>Tekrar turunda hepsini düzelttin.</em>":"");
  show("result");
}
function renderStats(){
  var stats=loadStats();
  var html="<h2 style='margin-bottom:10px'>İstatistikler</h2><p class='sub' style='margin-bottom:12px'>Toplam doğru "+(stats.totalCorrect||0)+" · yanlış "+(stats.totalWrong||0)+" · süre "+fmtTime(stats.totalMs||0)+"</p>";
  Object.keys(CATEGORIES).forEach(function(id){
    var cat=CATEGORIES[id], cs=stats.cats[id];
    html+="<div class='cat-stat'><strong>"+cat.emoji+" "+cat.name+"</strong><br>";
    if(!cs||!cs.plays){html+="<span class='sub'>"+cat.words.length+" kelime · henüz oynanmadı</span></div>";return}
    var acc=(cs.correct+cs.wrong)?Math.round(cs.correct/(cs.correct+cs.wrong)*100):0;
    var avg=cs.plays?fmtTime(cs.totalMs/cs.plays):"—";
    html+="<span class='sub'>"+cat.words.length+" kelime · "+cs.plays+" tur · "+cs.correct+"/"+cs.wrong+" · %"+acc+"<br>Son 20’lik: "+fmtTime(cs.lastMs||0)+" · ortalama "+avg+" · en hızlı "+(cs.bestMs!=null?fmtTime(cs.bestMs):"—")+"<br>Bekleyen yanlış: "+((cs.missed||[]).length)+"</span></div>";
  });
  document.getElementById("statsBody").innerHTML=html;
}
function trSort(a,b){return a.localeCompare(b,"tr")}
function renderDict(){
  var q=(document.getElementById("dictSearch").value||"").trim().toLocaleLowerCase("tr");
  var enFirst=state.dictDir==="en";
  var box=document.getElementById("dictList"); box.innerHTML="";
  var total=0,shown=0;
  Object.keys(CATEGORIES).forEach(function(id){
    var cat=CATEGORIES[id]; total+=cat.words.length;
    var rows=cat.words.map(function(w){return {en:w[0],tr:w[1],from:enFirst?w[0]:w[1],to:enFirst?w[1]:w[0]}})
      .filter(function(r){return !q||r.from.toLocaleLowerCase("tr").indexOf(q)>=0||r.to.toLocaleLowerCase("tr").indexOf(q)>=0})
      .sort(function(a,b){return enFirst?a.from.localeCompare(b.from,"en"):trSort(a.from,b.from)});
    if(!rows.length) return; shown+=rows.length;
    var wrap=document.createElement("div"); wrap.className="dict-cat"+(state.dictOpenAll?" open":"");
    wrap.innerHTML="<h3>"+cat.emoji+" "+cat.name+" <span class='dict-count'>"+rows.length+"</span></h3>";
    var list=document.createElement("div"); list.className="dict-rows";
    rows.forEach(function(r){
      var row=document.createElement("div"); row.className="drow";
      row.innerHTML="<span class='from'>"+r.from+"</span><span class='to'>"+r.to+"</span>";
      var sp=document.createElement("button"); sp.className="speak-btn mini"; sp.textContent="🔊";
      sp.onclick=function(e){e.stopPropagation();speakEnglish(r.en)};
      row.appendChild(sp); list.appendChild(row);
    });
    wrap.querySelector("h3").onclick=function(){wrap.classList.toggle("open")};
    wrap.appendChild(list); box.appendChild(wrap);
  });
  document.getElementById("dictCount").textContent=q?shown+" sonuç · toplam "+total+" kelime":"Toplam "+total+" kelime · kategorilere göre alfabetik";
  document.getElementById("toggleAll").textContent=state.dictOpenAll?"Tümünü daralt":"Tümünü genişlet";
}
function setDictAll(open){
  state.dictOpenAll=open;
  document.querySelectorAll("#dictList .dict-cat").forEach(function(el){el.classList.toggle("open",open)});
  document.getElementById("toggleAll").textContent=open?"Tümünü daralt":"Tümünü genişlet";
}
function renderFavs(){
  var q=(document.getElementById("favSearch").value||"").trim().toLocaleLowerCase("tr");
  var enFirst=state.favDir==="en";
  var box=document.getElementById("favList"); box.innerHTML="";
  var list=loadFavs();
  if(q) list=list.filter(function(f){return (f.en+" "+f.tr).toLocaleLowerCase("tr").indexOf(q)>=0});
  document.getElementById("favCount").textContent=list.length?list.length+" favori":"Henüz favori yok. Oyunda ☆ ile ekle.";
  if(!list.length){box.innerHTML="<div class='card empty'>Favori kelime yok.</div>";return}
  var byCat={};
  list.forEach(function(f){var k=f.catId||"_"; if(!byCat[k]) byCat[k]=[]; byCat[k].push(f)});
  Object.keys(byCat).forEach(function(id){
    var cat=CATEGORIES[id]||{emoji:"⭐",name:"Diğer"};
    var rows=byCat[id].slice().sort(function(a,b){return enFirst?a.en.localeCompare(b.en,"en"):trSort(a.tr,b.tr)});
    var wrap=document.createElement("div"); wrap.className="dict-cat open";
    wrap.innerHTML="<h3>"+cat.emoji+" "+cat.name+" <span class='dict-count'>"+rows.length+"</span></h3>";
    var listEl=document.createElement("div"); listEl.className="dict-rows";
    rows.forEach(function(r){
      var row=document.createElement("div"); row.className="drow";
      row.innerHTML="<span class='from'>"+(enFirst?r.en:r.tr)+"</span><span class='to'>"+(enFirst?r.tr:r.en)+"</span>";
      var sp=document.createElement("button"); sp.className="speak-btn mini"; sp.textContent="🔊";
      sp.onclick=function(){speakEnglish(r.en)};
      var rm=document.createElement("button"); rm.className="fav-btn mini on"; rm.textContent="★";
      rm.title="Favoriden çıkar"; rm.onclick=function(){toggleFav(r.en,r.tr,r.catId);renderFavs()};
      row.appendChild(sp); row.appendChild(rm); listEl.appendChild(row);
    });
    wrap.querySelector("h3").onclick=function(){wrap.classList.toggle("open")};
    wrap.appendChild(listEl); box.appendChild(wrap);
  });
}
function goHome(){stopTimer();renderHome();show("home")}
document.getElementById("goHome").onclick=goHome;
document.getElementById("homeBtn").onclick=goHome;
document.getElementById("statsHome").onclick=goHome;
document.getElementById("dictHome").onclick=goHome;
document.getElementById("favHome").onclick=goHome;
document.getElementById("speakBtn").onclick=function(){var q=currentQ(); if(q) speakEnglish(q.en)};
document.getElementById("favBtn").onclick=function(){var q=currentQ(); if(!q) return; toggleFav(q.en,q.tr,state.catId); syncFavBtn()};
document.getElementById("dictBtn").onclick=function(){document.getElementById("headerSub").textContent="Sözlük"; state.dictOpenAll=true; renderDict(); show("dict")};
document.getElementById("favNav").onclick=function(){document.getElementById("headerSub").textContent="Favoriler"; renderFavs(); show("favs")};
document.getElementById("statsBtn").onclick=function(){document.getElementById("headerSub").textContent="İstatistikler"; renderStats(); show("stats")};
document.getElementById("dictSearch").addEventListener("input",renderDict);
document.getElementById("favSearch").addEventListener("input",renderFavs);
document.getElementById("dirEn").onclick=function(){state.dictDir="en";document.getElementById("dirEn").classList.add("on");document.getElementById("dirTr").classList.remove("on");renderDict()};
document.getElementById("dirTr").onclick=function(){state.dictDir="tr";document.getElementById("dirTr").classList.add("on");document.getElementById("dirEn").classList.remove("on");renderDict()};
document.getElementById("favDirEn").onclick=function(){state.favDir="en";document.getElementById("favDirEn").classList.add("on");document.getElementById("favDirTr").classList.remove("on");renderFavs()};
document.getElementById("favDirTr").onclick=function(){state.favDir="tr";document.getElementById("favDirTr").classList.add("on");document.getElementById("favDirEn").classList.remove("on");renderFavs()};
document.getElementById("toggleAll").onclick=function(){setDictAll(!state.dictOpenAll)};
document.getElementById("againBtn").onclick=function(){startCategory(state.catId)};
document.getElementById("resetStats").onclick=function(){if(confirm("Tüm istatistikler silinsin mi?")){localStorage.removeItem(STORE_KEY);renderStats();renderHome()}};
document.getElementById("clearFavs").onclick=function(){if(confirm("Tüm favoriler silinsin mi?")){saveFavs([]);renderFavs()}};
renderHome();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
